name: SAIF.NET Android APK

on:
  workflow_dispatch:
  push:
    branches: ['main', 'feature/**']
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Generate Android platform files when missing
        shell: bash
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name=tikplus_ultra .
          fi

      - name: Ensure Android network permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          text = p.read_text()
          for permission in ['android.permission.INTERNET', 'android.permission.USE_BIOMETRIC']:
              if permission not in text:
                  text = text.replace('<application', f'<uses-permission android:name="{permission}"/>\\n    <application', 1)
          p.write_text(text)
          PY

      - name: Brand generated Android project
        shell: bash
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/com\.example\.tikplus_ultra/net.saifnet.routermanager/g' android/app/build.gradle.kts
          fi
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            sed -i 's/android:label="tikplus_ultra"/android:label="SAIF.NET Router Manager"/' android/app/src/main/AndroidManifest.xml
          fi
          activity="$(find android/app/src/main/kotlin -name MainActivity.kt -print -quit 2>/dev/null || true)"
          if [ -n "$activity" ]; then
            sed -i 's/^package .*/package net.saifnet.routermanager/' "$activity"
            target="android/app/src/main/kotlin/net/saifnet/routermanager/MainActivity.kt"
            mkdir -p "$(dirname "$target")"
            if [ "$activity" != "$target" ]; then mv "$activity" "$target"; fi
          fi

      - name: Remove incompatible generated starter widget test
        shell: bash
        run: |
          if [ -f test/widget_test.dart ] && ! git ls-files --error-unmatch test/widget_test.dart >/dev/null 2>&1; then
            if grep -q 'MyApp' test/widget_test.dart && ! grep -q 'class MyApp' lib/main.dart; then
              rm test/widget_test.dart
            fi
          fi

      - name: Resolve dependencies
        run: flutter pub get

      - name: Run regression tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: saif-net-router-manager-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
