name: SAIF.NET Android APK

on:
  workflow_dispatch:
  push:
    branches: ['feature/**']
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Generate Android platform files when missing
        shell: bash
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name=tikplus_ultra .
          fi

      - name: Remove incompatible generated starter widget test
        shell: bash
        run: |
          if [ -f test/widget_test.dart ] && ! git ls-files --error-unmatch test/widget_test.dart >/dev/null 2>&1; then
            if grep -q 'MyApp' test/widget_test.dart && ! grep -q 'class MyApp' lib/main.dart; then
              rm test/widget_test.dart
            fi
          fi

      - name: Resolve dependencies
        run: flutter pub get

      - name: Run regression tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: saif-net-router-manager-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
