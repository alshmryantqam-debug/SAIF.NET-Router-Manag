name: Nova Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/full-suite
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/nova-android-apk.yml'

permissions:
  contents: read

concurrency:
  group: nova-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze and build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project when absent
        shell: bash
        run: |
          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            rm -rf android
            flutter create --project-name nova_router_manager --platforms=android --org net.saif .
          fi

      - name: Apply Nova Android identity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text()
          if 'android.permission.INTERNET' not in source:
              source = source.replace('<application', '    <uses-permission android:name="android.permission.INTERNET" />\\n    <application', 1)
          source = re.sub(r'android:label="[^"]*"', 'android:label="نوڨا"', source, count=1)
          manifest.write_text(source)

          gradle = Path("android/app/build.gradle.kts")
          if gradle.exists():
              source = gradle.read_text()
              source = re.sub(r'applicationId\\s*=\\s*"[^"]+"', 'applicationId = "net.saif.nova"', source)
              source = re.sub(r'minSdk\\s*=\\s*flutter.minSdkVersion', 'minSdk = 24', source)
              gradle.write_text(source)
          else:
              gradle = Path("android/app/build.gradle")
              if gradle.exists():
                  source = gradle.read_text()
                  source = re.sub(r'applicationId\\s+"[^"]+"', 'applicationId "net.saif.nova"', source)
                  source = re.sub(r'minSdkVersion\\s+flutter.minSdkVersion', 'minSdkVersion 24', source)
                  gradle.write_text(source)
          PY

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze Dart
        run: flutter analyze --no-pub

      - name: Build debug APK
        run: flutter build apk --debug --build-number=${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Android-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
