name: Flutter Analyze
on:
  workflow_dispatch:
  pull_request:
    paths: ['lib/**', 'test/**', 'pubspec.yaml', 'analysis_options.yaml', '.github/workflows/flutter-analyze.yml']
  push:
    branches: [main]
    paths: ['lib/**', 'test/**', 'pubspec.yaml', 'analysis_options.yaml', '.github/workflows/flutter-analyze.yml']
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Analyze (existing info-level lints are reported but not fatal)
        run: flutter analyze --no-fatal-infos