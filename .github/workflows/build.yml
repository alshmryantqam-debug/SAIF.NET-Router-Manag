name: Build TikPlus ULTRA APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['lib/**', 'pubspec.yaml', '.github/workflows/build.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Ensure Android project
        run: |
          if [ ! -f android/gradlew ]; then flutter create --project-name tikplus_ultra --platforms=android --org com.tikplus.ultra .; fi
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          for permission in ['android.permission.INTERNET','android.permission.USE_BIOMETRIC']:
              if permission not in s:
                  s=s.replace('<application', f'<uses-permission android:name="{permission}"/>\n    <application', 1)
          p.write_text(s)

          # Use Android SDK 35 required by current Flutter plugins.
          for build_file in [Path('android/app/build.gradle'), Path('android/app/build.gradle.kts')]:
              if build_file.exists():
                  build_text = build_file.read_text()
                  build_text = build_text.replace('compileSdkVersion flutter.compileSdkVersion', 'compileSdkVersion 35')
                  build_text = build_text.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 35')
                  build_file.write_text(build_text)
          PY
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze --no-pub
        continue-on-error: true
      - run: flutter build apk --release
      - name: Smoke test APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048 -cores 2
          disable-animations: true
          script: |
            APK="build/app/outputs/flutter-apk/app-release.apk"
            adb install "$APK"
            PACKAGE="$(apkanalyzer manifest application-id "$APK")"
            adb shell monkey -p "$PACKAGE" 1
            sleep 8
            if ! adb shell pidof "$PACKAGE" >/dev/null; then
              adb logcat -d -t 1200 > emulator-logcat.txt
              cat emulator-logcat.txt
              echo "App process exited after launch"
              exit 1
            fi
      - uses: actions/upload-artifact@v4
        with:
          name: TikPlus-ULTRA-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
