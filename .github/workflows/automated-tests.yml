name: Automated Tests
on:
  workflow_dispatch:
  pull_request:
    paths: ['lib/**', 'test/**', 'pubspec.yaml', '.github/workflows/automated-tests.yml']
  push:
    paths: ['lib/**', 'test/**', 'pubspec.yaml', '.github/workflows/automated-tests.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter test