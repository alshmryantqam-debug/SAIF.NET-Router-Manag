name: Build TikPlus ULTRA APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: tikplus-ultra-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Generate Android platform files if missing
        run: |
          if [ ! -d android ]; then
            flutter create --project-name tikplus_ultra --platforms=android --org com.tikplus.ultra .
            git checkout -- test/widget_test.dart
          fi

      - name: Ensure Android network permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          content = path.read_text()
          permission = '    <uses-permission android:name="android.permission.INTERNET" />'
          if "android.permission.INTERNET" not in content:
              content = content.replace("<application", permission + "\n    <application", 1)
          path.write_text(content)
          PY

      - name: Ensure speech recognition permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          content = path.read_text()
          permission = '    <uses-permission android:name="android.permission.RECORD_AUDIO" />'
          if "android.permission.RECORD_AUDIO" not in content:
              content = content.replace("<application", permission + "\n    <application", 1)
          queries = '''    <queries>
              <intent>
                  <action android:name="android.speech.RecognitionService" />
              </intent>
          </queries>'''
          if "android.speech.RecognitionService" not in content:
              content = content.replace("<application", queries + "\n    <application", 1)
          path.write_text(content)
          PY

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Run tests
        run: flutter test --no-pub

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TikPlus-ULTRA-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
