name: Build SAIF.NET Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "src/**"
      - "index.html"
      - "public/**"
      - "migrations/**"
      - "wrangler.jsonc"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          
      - name: Validate Worker and dashboard JavaScript
        run: |
          node --check src/index.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("public/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, flags=re.S | re.I)
          Path("/tmp/saif-dashboard.js").write_text("\n;\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/saif-dashboard.js

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SAIF-NET-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
