name: Build TikPlus ULTRA APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: tikplus-ultra-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Generate Android platform files if missing
        run: |
          if [ ! -d android ]; then
            flutter create --project-name tikplus_ultra --platforms=android --org com.tikplus.ultra .
          fi

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test --no-pub

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TikPlus-ULTRA-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
