name: Build SAIF.NET Router Manager APK

on:
  workflow_dispatch:
  push:
    branches: [feature/full-suite]
    paths:
      - 'lib/**'
      - '.gitignore'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: saifnet-router-manager-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files if missing
        run: |
          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            rm -rf android
            flutter create --project-name nova_router_manager --platforms=android --org net.saif .
          fi

      - name: Configure Android biometric support and minimum SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          permission = '    <uses-permission android:name="android.permission.USE_BIOMETRIC" />'
          if "android.permission.USE_BIOMETRIC" not in text:
              text = text.replace("<application", permission + "\n    <application", 1)
          text = re.sub(r'android:label="[^"]*"', 'android:label="نوڨا"', text)
          manifest.write_text(text)

          for gradle in (Path("android/app/build.gradle"), Path("android/app/build.gradle.kts")):
              if not gradle.exists():
                  continue
              text = gradle.read_text()
              if gradle.suffix == ".kts":
                  text = re.sub(r'applicationId\\s*=\\s*"[^"]+"', 'applicationId = "net.saif.nova"', text)
                  text = re.sub(r"minSdk\\s*=\\s*flutter\\.minSdkVersion", "minSdk = maxOf(24, flutter.minSdkVersion)", text)
                  text = re.sub(r"minSdk\\s*=\\s*\\d+", "minSdk = maxOf(24, 24)", text)
                  if 'create("release")' not in text:
                      text = text.replace("    buildTypes {", '''    signingConfigs {
        create("release") {
            val props = java.util.Properties()
            val propsFile = rootProject.file("key.properties")
            propsFile.inputStream().use { props.load(it) }
            storeFile = file(props["storeFile"] as String)
            storePassword = props["storePassword"] as String
            keyAlias = props["keyAlias"] as String
            keyPassword = props["keyPassword"] as String
        }
    }
    buildTypes {''', 1)
                  text = text.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("release")')
              else:
                  text = re.sub(r'applicationId\\s+"[^"]+"', 'applicationId "net.saif.nova"', text)
                  text = re.sub(r"minSdkVersion\\s+flutter\\.minSdkVersion", "minSdkVersion 24", text)
                  text = re.sub(r"minSdkVersion\\s+\\d+", "minSdkVersion 24", text)
                  if "signingConfigs {" not in text:
                      text = text.replace("    buildTypes {", '''    signingConfigs {
        release {
            def props = new Properties()
            def propsFile = rootProject.file("key.properties")
            propsFile.withInputStream { props.load(it) }
            storeFile file(props["storeFile"])
            storePassword props["storePassword"]
            keyAlias props["keyAlias"]
            keyPassword props["keyPassword"]
        }
    }
    buildTypes {''', 1)
                  text = re.sub(r'signingConfig\\s+signingConfigs\\.debug', 'signingConfig signingConfigs.release', text)
              gradle.write_text(text)

          activity_files = list(Path("android/app/src/main").rglob("MainActivity.kt")) + list(Path("android/app/src/main").rglob("MainActivity.java"))
          if activity_files:
              activity = activity_files[0]
              text = activity.read_text()
              text = text.replace("import io.flutter.embedding.android.FlutterActivity", "import io.flutter.embedding.android.FlutterFragmentActivity")
              text = text.replace("extends FlutterActivity", "extends FlutterFragmentActivity")
              text = text.replace(": FlutterActivity()", ": FlutterFragmentActivity()")
              activity.write_text(text)
          else:
              raise SystemExit("MainActivity was not generated by flutter create")
          PY

      - name: Ensure Android network permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          content = path.read_text()
          permission = '    <uses-permission android:name="android.permission.INTERNET" />'
          if "android.permission.INTERNET" not in content:
              content = content.replace("<application", permission + "\n    <application", 1)
          path.write_text(content)
          PY

      - name: Ensure speech recognition permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          content = path.read_text()
          permission = '    <uses-permission android:name="android.permission.RECORD_AUDIO" />'
          if "android.permission.RECORD_AUDIO" not in content:
              content = content.replace("<application", permission + "\n    <application", 1)
          queries = '''    <queries>
              <intent>
                  <action android:name="android.speech.RecognitionService" />
              </intent>
          </queries>'''
          if "android.speech.RecognitionService" not in content:
              content = content.replace("<application", queries + "\n    <application", 1)
          path.write_text(content)
          PY

      - name: Configure release signing from GitHub Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing GitHub Secret KEYSTORE_BASE64" && exit 1)
          mkdir -p android/app
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/nova.jks
          cat > android/key.properties <<EOF
          storeFile=app/nova.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build split release APKs
        run: flutter build apk --release --split-per-abi --build-number=${{ github.run_number }}

      - name: Upload all APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SAIF.NET-Router-Manager-APKs
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
