name: Build NOVA Universal APK

on:
  workflow_dispatch:
  push:
    branches: [feature/full-suite]
    paths:
      - 'lib/**'
      - '.gitignore'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: saifnet-router-manager-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files if missing
        run: |
          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            rm -rf android
            flutter create --project-name nova_router_manager --platforms=android --org net.nova .
          fi

      - name: Configure Android biometric support and minimum SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          permission = '    <uses-permission android:name="android.permission.USE_BIOMETRIC" />'
          if "android.permission.USE_BIOMETRIC" not in text:
              text = text.replace("<application", permission + "\n    <application", 1)
          text = re.sub(r'android:label="[^"]*"', 'android:label="NOVA"', text)
          text = re.sub(r'android:icon="[^"]*"', 'android:icon="@drawable/nova_launcher_icon"', text, count=1)
          if 'android:icon="' not in text:
              text = text.replace("<application", '<application android:icon="@drawable/nova_launcher_icon"', 1)
          text = re.sub(r'android:roundIcon="[^"]*"', 'android:roundIcon="@drawable/nova_launcher_icon"', text, count=1)
          if 'android:roundIcon="' not in text:
              text = text.replace("<application", '<application android:roundIcon="@drawable/nova_launcher_icon"', 1)
          manifest.write_text(text)

          drawable = Path("android/app/src/main/res/drawable")
          drawable.mkdir(parents=True, exist_ok=True)
          (drawable / "nova_launcher_icon.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#090B14" android:pathData="M24,0 L84,0 C97.3,0 108,10.7 108,24 L108,84 C108,97.3 97.3,108 84,108 L24,108 C10.7,108 0,97.3 0,84 L0,24 C0,10.7 10.7,0 24,0 Z"/>
              <path android:fillColor="#00000000" android:strokeColor="#63D7F5" android:strokeWidth="4" android:pathData="M23,54 C23,36 37,22 54,22 C71,22 85,36 85,54 C85,72 71,86 54,86"/>
              <path android:fillColor="#9875FF" android:pathData="M54,28 L62,46 L80,54 L62,62 L54,80 L46,62 L28,54 L46,46 Z"/>
              <path android:fillColor="#F5F6FC" android:pathData="M73,28 L80,35 L68,47 L61,40 Z"/>
          </vector>
          """)

          for gradle in (Path("android/app/build.gradle"), Path("android/app/build.gradle.kts")):
              if not gradle.exists():
                  continue
              text = gradle.read_text()
              if gradle.suffix == ".kts":
                  text = re.sub(r'applicationId\s*=\s*"[^"]+"', 'applicationId = "net.nova.nova_router_manager"', text)
                  text = re.sub(r"minSdk\s*=\s*flutter\.minSdkVersion", "minSdk = maxOf(24, flutter.minSdkVersion)", text)
                  text = re.sub(r"minSdk\s*=\s*\d+", "minSdk = maxOf(24, 24)", text)
                  if 'create("release")' not in text:
                      text = text.replace("    buildTypes {", '''    signingConfigs {
        create("release") {
            val props = java.util.Properties()
            val propsFile = rootProject.file("key.properties")
            propsFile.inputStream().use { props.load(it) }
            storeFile = rootProject.file(props["storeFile"] as String)
            storePassword = props["storePassword"] as String
            keyAlias = props["keyAlias"] as String
            keyPassword = props["keyPassword"] as String
        }
    }
    buildTypes {''', 1)
                  text = text.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("release")')
              else:
                  text = re.sub(r'applicationId\s+"[^"]+"', 'applicationId "net.nova.nova_router_manager"', text)
                  text = re.sub(r"minSdkVersion\s+flutter\.minSdkVersion", "minSdkVersion 24", text)
                  text = re.sub(r"minSdkVersion\s+\d+", "minSdkVersion 24", text)
                  if "signingConfigs {" not in text:
                      text = text.replace("    buildTypes {", '''    signingConfigs {
        release {
            def props = new Properties()
            def propsFile = rootProject.file("key.properties")
            propsFile.withInputStream { props.load(it) }
            storeFile rootProject.file(props["storeFile"])
            storePassword props["storePassword"]
            keyAlias props["keyAlias"]
            keyPassword props["keyPassword"]
        }
    }
    buildTypes {''', 1)
                  text = re.sub(r'signingConfig\s+signingConfigs\.debug', 'signingConfig signingConfigs.release', text)
              gradle.write_text(text)

          activity_files = list(Path("android/app/src/main").rglob("MainActivity.kt")) + list(Path("android/app/src/main").rglob("MainActivity.java"))
          if activity_files:
              activity = activity_files[0]
              text = activity.read_text()
              text = text.replace("import io.flutter.embedding.android.FlutterActivity", "import io.flutter.embedding.android.FlutterFragmentActivity")
              text = text.replace("extends FlutterActivity", "extends FlutterFragmentActivity")
              text = text.replace(": FlutterActivity()", ": FlutterFragmentActivity()")
              activity.write_text(text)
          else:
              raise SystemExit("MainActivity was not generated by flutter create")
          PY

      - name: Ensure Android network permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          content = path.read_text()
          permission = '    <uses-permission android:name="android.permission.INTERNET" />'
          if "android.permission.INTERNET" not in content:
              content = content.replace("<application", permission + "\n    <application", 1)
          path.write_text(content)
          PY

      - name: Ensure speech recognition permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          content = path.read_text()
          permission = '    <uses-permission android:name="android.permission.RECORD_AUDIO" />'
          if "android.permission.RECORD_AUDIO" not in content:
              content = content.replace("<application", permission + "\n    <application", 1)
          queries = '''    <queries>
              <intent>
                  <action android:name="android.speech.RecognitionService" />
              </intent>
          </queries>'''
          if "android.speech.RecognitionService" not in content:
              content = content.replace("<application", queries + "\n    <application", 1)
          path.write_text(content)
          PY

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p android/app
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/nova.jks
            STORE_PASSWORD="$KEYSTORE_PASSWORD"
            SIGNING_ALIAS="$KEY_ALIAS"
            SIGNING_PASSWORD="$KEY_PASSWORD"
            echo "Using persistent release signing key from GitHub Secrets."
          else
            echo "::warning::Release signing secrets are incomplete. Creating a temporary signing key for this build only. Add all four secrets to preserve app-update compatibility."
            STORE_PASSWORD="$(openssl rand -hex 24)"
            SIGNING_ALIAS="nova"
            SIGNING_PASSWORD="$STORE_PASSWORD"
            keytool -genkeypair -v -keystore android/app/nova.jks -storetype JKS -storepass "$STORE_PASSWORD" -keypass "$SIGNING_PASSWORD" -alias "$SIGNING_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SAIF.NET Nova, OU=Mobile, O=SAIF.NET, L=Unknown, ST=Unknown, C=SY"
          fi
          cat > android/key.properties <<EOF
          storeFile=app/nova.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$SIGNING_ALIAS
          keyPassword=$SIGNING_PASSWORD
          EOF

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build one universal release APK
        run: flutter build apk --release --no-tree-shake-icons --build-number=${{ github.run_number }}

      - name: Prepare single NOVA download
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/NOVA.apk

      - name: Upload NOVA APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Android-APK
          path: dist/NOVA.apk
          if-no-files-found: error
          retention-days: 14
