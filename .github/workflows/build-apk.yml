name: Build NOVA Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/full-suite
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: nova-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze and build NOVA APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            flutter create --project-name nova --platforms=android --org net.nova .
          fi

      - name: Apply NOVA identity and Android compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text(encoding="utf-8")

          for permission in (
              "android.permission.INTERNET",
              "android.permission.USE_BIOMETRIC",
          ):
              if permission not in source:
                  source = source.replace(
                      "<application",
                      f'    <uses-permission android:name="{permission}" />\n    <application',
                      1,
                  )

          source = re.sub(r'android:label="[^"]*"', 'android:label="نوڨا"', source, count=1)
          source = re.sub(r'android:icon="[^"]*"', 'android:icon="@drawable/nova_launcher_icon"', source, count=1)
          source = re.sub(r'android:roundIcon="[^"]*"', 'android:roundIcon="@drawable/nova_launcher_icon"', source, count=1)
          if 'android:icon="' not in source:
              source = source.replace("<application", '<application android:icon="@drawable/nova_launcher_icon"', 1)
          if 'android:roundIcon="' not in source:
              source = source.replace("<application", '<application android:roundIcon="@drawable/nova_launcher_icon"', 1)
          manifest.write_text(source, encoding="utf-8")

          gradle_kts = Path("android/app/build.gradle.kts")
          gradle_groovy = Path("android/app/build.gradle")
          gradle = gradle_kts if gradle_kts.exists() else gradle_groovy
          if not gradle.exists():
              raise SystemExit("Could not find the generated Android app Gradle file.")
          source = gradle.read_text(encoding="utf-8")
          if gradle.suffix == ".kts":
              source = re.sub(
                  r"minSdk\s*=\s*flutter\.minSdkVersion",
                  "minSdk = 24",
                  source,
                  count=1,
              )
          else:
              source = re.sub(
                  r"minSdkVersion\s+flutter\.minSdkVersion",
                  "minSdkVersion 24",
                  source,
                  count=1,
              )
          gradle.write_text(source, encoding="utf-8")

          activity_files = (
              list(Path("android/app/src/main").rglob("MainActivity.kt"))
              + list(Path("android/app/src/main").rglob("MainActivity.java"))
          )
          if not activity_files:
              raise SystemExit("Flutter MainActivity was not generated.")
          activity = activity_files[0]
          source = activity.read_text(encoding="utf-8")
          source = source.replace(
              "import io.flutter.embedding.android.FlutterActivity",
              "import io.flutter.embedding.android.FlutterFragmentActivity",
          )
          source = source.replace("extends FlutterActivity", "extends FlutterFragmentActivity")
          source = source.replace(": FlutterActivity()", ": FlutterFragmentActivity()")
          activity.write_text(source, encoding="utf-8")

          drawable = Path("android/app/src/main/res/drawable")
          drawable.mkdir(parents=True, exist_ok=True)
          icon = r'''<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#090B14"
                  android:pathData="M18,0 L90,0 C100,0 108,8 108,18 L108,90 C108,100 100,108 90,108 L18,108 C8,108 0,100 0,90 L0,18 C0,8 8,0 18,0 Z"/>
              <path
                  android:fillColor="#00000000"
                  android:strokeColor="#63D7F5"
                  android:strokeWidth="4"
                  android:pathData="M27,54 C27,39 39,27 54,27 C69,27 81,39 81,54 C81,69 69,81 54,81"/>
              <path
                  android:fillColor="#9875FF"
                  android:pathData="M54,31 L63,46 L80,54 L63,62 L54,77 L45,62 L28,54 L45,46 Z"/>
          </vector>
          '''
          (drawable / "nova_launcher_icon.xml").write_text(icon, encoding="utf-8")
          PY

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Configure stable NOVA release signing
        shell: bash
        env:
          NOVA_KEYSTORE_BASE64: ${{ secrets.NOVA_KEYSTORE_BASE64 }}
          NOVA_KEYSTORE_PASSWORD: ${{ secrets.NOVA_KEYSTORE_PASSWORD }}
          NOVA_KEY_ALIAS: ${{ secrets.NOVA_KEY_ALIAS }}
          NOVA_KEY_PASSWORD: ${{ secrets.NOVA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$NOVA_KEYSTORE_BASE64" || { echo "Missing GitHub secret NOVA_KEYSTORE_BASE64"; exit 1; }
          test -n "$NOVA_KEYSTORE_PASSWORD" || { echo "Missing GitHub secret NOVA_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$NOVA_KEY_ALIAS" || { echo "Missing GitHub secret NOVA_KEY_ALIAS"; exit 1; }
          test -n "$NOVA_KEY_PASSWORD" || { echo "Missing GitHub secret NOVA_KEY_PASSWORD"; exit 1; }
          mkdir -p "$RUNNER_TEMP/nova-signing"
          printf '%s' "$NOVA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nova-signing/nova.jks"
          test -s "$RUNNER_TEMP/nova-signing/nova.jks"
          echo "NOVA_KEYSTORE_PATH=$RUNNER_TEMP/nova-signing/nova.jks" >> "$GITHUB_ENV"

      - name: Configure Android package ID and release signing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          gradle = Path("android/app/build.gradle.kts")
          if not gradle.exists():
              raise SystemExit("Expected generated build.gradle.kts")
          source = gradle.read_text(encoding="utf-8")
          source = re.sub(r'namespace\s*=\s*"[^"]+"', 'namespace = "net.nova.nova"', source, count=1)
          source = re.sub(r'applicationId\s*=\s*"[^"]+"', 'applicationId = "net.nova.nova"', source, count=1)
          source = re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 24', source, count=1)
          if 'create("release")' not in source:
              block = '    signingConfigs {\n        create("release") {\n            storeFile = file(System.getenv("NOVA_KEYSTORE_PATH"))\n            storePassword = System.getenv("NOVA_KEYSTORE_PASSWORD")\n            keyAlias = System.getenv("NOVA_KEY_ALIAS")\n            keyPassword = System.getenv("NOVA_KEY_PASSWORD")\n        }\n    }\n\n    buildTypes {'
              source = source.replace('    buildTypes {', block, 1)
          source = re.sub(r'release\s*\{', 'release {\n            signingConfig = signingConfigs.getByName("release")', source, count=1)
          gradle.write_text(source, encoding="utf-8")
          PY
      - name: Build one installable APK
        run: flutter build apk --release --no-tree-shake-icons --build-number=${{ github.run_number }}

      - name: Prepare single NOVA download
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/nova.apk
          test -s dist/nova.apk

      - name: Upload NOVA APK
        uses: actions/upload-artifact@v4
        with:
          name: nova.apk
          path: dist/nova.apk
          if-no-files-found: error
          retention-days: 14
