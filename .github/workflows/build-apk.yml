name: Build SAIF.NET Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5 # تم التحديث إلى v5 للتخلص من التحذير
        with:
          distribution: temurin
          java-version: "17"

      # سيرفرات GitHub تحتوي مسبقاً على Android SDK، لذا تم حذف الخطوة الزائدة

      - name: Make Gradle Wrapper Executable
        # إعطاء صلاحية التشغيل لملف Gradle Wrapper
        run: chmod +x ./gradlew
          
      - name: Build APK
        # استخدام Gradle Wrapper بدلاً من التحميل اليدوي
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SAIF-NET-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

concurrency:
  group: saif-net-android-build
  cancel-in-progress: true
